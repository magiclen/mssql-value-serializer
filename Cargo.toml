[package]
name = "mssql-value-serializer"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/mssql-value-serializer"
homepage = "https://magiclen.org/mssql-value-serializer"
keywords = ["mssql", "sql-server", "db", "database"]
categories = ["database", "text-processing"]
description = "Convert Rust values into SQL Server-compatible literal expressions, enabling dynamic SQL generation without parameter count limitations."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
const-hex = "1.19.3"

serde = { version = "1.0.229", optional = true }

chrono = { version = "0.4.45", optional = true }
jiff = { version = "0.2.38", optional = true, default-features = false, features = ["std"] }
time = { version = "0.3.55", optional = true }

rust_decimal = { version = "1.43.0", optional = true }
bigdecimal = { version = "0.4.11", optional = true }
num-bigint = { version = "0.4.8", optional = true }
uuid = { version = "1.28.0", optional = true }

[dev-dependencies]
time = { version = "0.3.55", features = ["parsing"] }

[features]
serde = ["dep:serde"]

chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
time = ["dep:time"]

rust_decimal = ["dep:rust_decimal"]
bigdecimal = ["dep:bigdecimal", "num-bigint"]
num-bigint = ["dep:num-bigint"]
uuid = ["dep:uuid"]

stable-local = ["chrono"]      # cache the first local UTC offset and format other offsets directly

all = ["serde", "chrono", "jiff", "time", "rust_decimal", "bigdecimal", "uuid"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
